<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCA Social Media Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#EAF0F4; --panel:#FFFFFF; --ink:#13233F; --muted:#5B6B82; --line:#D5DEE7;
  --side:#13233F; --side-ink:#DCE6F0; --side-muted:#8FA3BC; --side-active:#22365A;
  --tt:#0F9AA8; --ig:#B8336A; --fb:#3D5FB0;
  --up:#1F8A5B; --down:#C2452D;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0E1726; --panel:#16223A; --ink:#E4ECF5; --muted:#93A4BB; --line:#26354F;
    --side:#0A1220; --side-ink:#DCE6F0; --side-muted:#7D90AA; --side-active:#1A2A45;
    --tt:#3CC4CF; --ig:#E0679A; --fb:#7E9CE6;
    --up:#4CC48C; --down:#F07D63;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--tt);outline-offset:2px}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.brand{font:700 18px/1.2 var(--display);padding:0 8px}
.brand small{display:block;font:400 13px/1.4 var(--body);color:var(--side-muted);margin-top:4px}
.side h2{font:500 13px var(--body);color:var(--side-muted);margin:0 8px 8px}
.clients{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.clients button{all:unset;box-sizing:border-box;width:100%;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.clients button:hover{background:var(--side-active)}
.clients button[aria-current="true"]{background:var(--side-active);font-weight:600}
.clients button:disabled{cursor:default;color:var(--side-muted)}
.clients button:disabled:hover{background:none}
.clients .tag{font-size:12px;color:var(--side-muted)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 8px}

main{padding:28px clamp(16px,4vw,44px) 56px;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.top h1{font:700 clamp(28px,4vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--muted)}

.range{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.range label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.range select{font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.presets{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.presets button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;color:var(--muted)}
.presets button + button{border-left:1px solid var(--line)}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent,var(--ink))}

.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.plat{padding:22px 24px;border-top:5px solid var(--c)}
.plat + .plat{border-left:1px solid var(--line)}
.plat h3{font:700 20px var(--display);margin:0 0 2px}
.plat .handle{color:var(--muted);font-size:13px;margin-bottom:18px}
.plat dl{margin:0;display:grid;gap:14px}
.plat dt{font-size:13px;color:var(--muted)}
.plat dd{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.plat .v{font:700 26px/1.1 var(--display)}
.spark{display:block;width:100%;height:30px;margin-top:4px;color:var(--c)}
.chg{font-size:13px;font-weight:600}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}

.section{margin-top:28px}
.section > h2{font:700 20px var(--display);margin:0 0 12px}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.section-head h2{font:700 20px var(--display);margin:0}
.section-head label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.section-head select{font:500 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.notes{margin-bottom:16px;border-left:4px solid var(--muted)}
.notes h3{font:700 16px var(--display);margin:0 0 6px}
.notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.notes li + li{margin-top:4px}
.takeaways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.takeaways .panel{border-left:4px solid var(--c)}
.takeaways h3{font:700 16px var(--display);margin:0 0 8px}
.takeaways ul{margin:0;padding-left:18px}
.takeaways li + li{margin-top:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--panel);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:700 24px/1.2 var(--display);margin:4px 0 2px}
.kpi .prev{font-size:12px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-wrap{position:relative;height:280px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:80ch}
.empty{color:var(--muted)}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--panel)}
td.cap,th.cap{text-align:left;white-space:normal;min-width:260px;max-width:420px}
td.d,th.d{text-align:left}
th.m,td.m{text-align:left;font-weight:500;color:var(--ink);position:sticky;left:0;background:var(--panel)}
td.tot,th.tot{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.cap a{text-decoration:none}
td.cap a:hover{text-decoration:underline}
.type{display:inline-block;font-size:12px;color:var(--muted);margin-right:6px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar span{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block}
.bar span i{display:block;height:100%;background:var(--accent)}
.bar b{text-align:right;font-weight:600}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 8px}
.split i{display:block;height:100%}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{padding:16px;gap:12px}
  .clients{flex-direction:row;overflow-x:auto}
  .clients button{white-space:nowrap}
  .side-foot{display:none}
  .strip,.takeaways,.grid2{grid-template-columns:1fr}
  .plat + .plat{border-left:none;border-top:5px solid var(--c)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">PCA Social Report<small>Monthly client reporting</small></div>
    <nav aria-label="Clients">
      <h2>Clients</h2>
      <ul class="clients" id="clientList"></ul>
    </nav>
    <div class="side-foot" id="sourceNote"></div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <div class="range" role="group" aria-label="Report period">
        <div class="presets" id="presets"></div>
        <label>From <select id="fromSelect"></select></label>
        <label>To <select id="toSelect"></select></label>
      </div>
    </div>

    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nf = new Intl.NumberFormat("en-US");
const fmt = n => n == null ? "–" : nf.format(Math.round(n * 100) / 100);
const short = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? (n/1e3).toFixed(1)+"K" : nf.format(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthName = (k, style="long") => { const [y,m] = k.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("en-GB", style === "long" ? {month:"long", year:"numeric"} : {month:"short"}); };
const dayLabel = iso => new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});

function fmtU(v, unit){
  if (v == null) return "–";
  if (unit === "s") return v.toFixed(1) + "s";
  if (unit === "%") return (v * 100 < 0.1 && v > 0 ? (v * 100).toFixed(3) : (v * 100).toFixed(2)) + "%";
  return fmt(v);
}
function change(cur, prev, unit, lowerIsBetter){
  if (prev == null || cur == null) return `<span class="chg flat">No comparison</span>`;
  if (unit === "%"){
    const pt = (cur - prev) * 100;
    if (Math.abs(pt) < 0.005) return `<span class="chg flat">0.00 pt</span>`;
    const cls = Math.abs(pt) < 0.05 ? "flat" : pt > 0 ? "up" : "down";
    return `<span class="chg ${cls}">${pt > 0 ? "+" : ""}${pt.toFixed(2)} pt</span>`;
  }
  if (prev === 0) return `<span class="chg flat">New</span>`;
  const p = (cur - prev) / prev * 100;
  const good = lowerIsBetter ? p < 0 : p > 0;
  const cls = Math.abs(p) < 0.5 ? "flat" : good ? "up" : "down";
  return `<span class="chg ${cls}">${p > 0 ? "+" : ""}${p.toFixed(1)}%</span>`;
}

/* All metrics for one platform in one month, as {name: {v, unit, add}}, incl. engagement rate */
function metricsFor(p, monthKey){
  const row = DATA[state.client].months[monthKey]?.[p.key];
  const out = [];
  p.metrics.forEach((m, i) => {
    out.push({n:m.n, unit:m.unit, add:!!m.add, lib:!!m.lowerIsBetter, snap:!!m.snapshot, v: row ? row[i] : null});
    if (p.er && m.n === p.er[0]){
      const num = row ? row[p.metrics.findIndex(x => x.n === p.er[0])] : null;
      const den = row ? row[p.metrics.findIndex(x => x.n === p.er[1])] : null;
      out.push({n:"Engagement rate", unit:"%", add:false, v: (num != null && den) ? num / den : null});
    }
  });
  return out;
}
const pick = (list, name) => list.find(x => x.n === name);

/* ---------- state ---------- */
const state = { client:"perspirex", from:null, to:null, tab:"overview", trendMetric:{} };
let charts = [];
const monthKeys = () => Object.keys(DATA[state.client].months).sort();
const rangeKeys = () => monthKeys().filter(k => k >= state.from && k <= state.to);
const prevKey = k => { const ks = monthKeys(); const i = ks.indexOf(k); return i > 0 ? ks[i-1] : null; };

/* ---------- controls ---------- */
function renderClients(){
  $("#clientList").innerHTML = Object.entries(DATA).map(([key, c]) => {
    const has = Object.keys(c.months).length > 0;
    return `<li><button type="button" data-client="${key}" ${has ? "" : "disabled"} aria-current="${key === state.client}">
      ${esc(c.name)}${has ? "" : `<span class="tag">No report yet</span>`}</button></li>`;
  }).join("");
  $("#clientList").querySelectorAll("button:not(:disabled)").forEach(b =>
    b.addEventListener("click", () => { state.client = b.dataset.client; state.from = state.to = null; state.tab = "overview"; render(); }));
}

const PRESETS = [["Latest month",1],["Last 3 months",3],["Last 6 months",6]];
function renderRange(){
  const ks = monthKeys();
  if (!state.to || !ks.includes(state.to)) state.to = ks[ks.length - 1];
  if (!state.from || !ks.includes(state.from)) state.from = state.to;
  const opts = sel => ks.map(k => `<option value="${k}" ${k === sel ? "selected" : ""}>${monthName(k)}</option>`).join("");
  $("#fromSelect").innerHTML = opts(state.from);
  $("#toSelect").innerHTML = opts(state.to);
  const span = rangeKeys().length, last = state.to === ks[ks.length - 1];
  $("#presets").innerHTML = PRESETS.map(([label, n]) =>
    `<button type="button" data-n="${n}" aria-pressed="${last && span === Math.min(n, ks.length)}">${label}</button>`).join("");
  $("#presets").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const n = Number(b.dataset.n);
    state.to = ks[ks.length - 1];
    state.from = ks[Math.max(0, ks.length - n)];
    render();
  }));
}
$("#fromSelect").addEventListener("change", e => { state.from = e.target.value; if (state.from > state.to) state.to = state.from; render(); });
$("#toSelect").addEventListener("change", e => { state.to = e.target.value; if (state.to < state.from) state.from = state.to; render(); });

function renderTabs(){
  const tabs = [{key:"overview", name:"Overview", cssVar:"--ink"}, ...PLATFORMS];
  $("#tabs").innerHTML = tabs.map(t =>
    `<button type="button" role="tab" data-tab="${t.key}" aria-selected="${t.key === state.tab}" style="--accent:var(${t.cssVar})">${t.name}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
}

/* ---------- small SVG sparkline ---------- */
function spark(values){
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const vs = pts.map(p => p[1]), min = Math.min(...vs), max = Math.max(...vs), n = values.length - 1;
  const xy = pts.map(([i, v]) => `${(i / n * 100).toFixed(2)},${(26 - (max === min ? 13 : (v - min) / (max - min) * 22) - 2).toFixed(2)}`);
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${xy.join(" ")}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- overview ---------- */
function overview(){
  const ks = rangeKeys(), single = ks.length === 1, end = ks[ks.length - 1];
  const base = single ? prevKey(end) : ks[0];
  const handles = DATA[state.client].handles || {};

  const strip = PLATFORMS.map(p => {
    const cur = metricsFor(p, end), ref = base ? metricsFor(p, base) : null;
    const rows = p.headline.map(name => {
      const c = pick(cur, name), r = ref ? pick(ref, name) : null;
      const series = ks.map(k => pick(metricsFor(p, k), name).v);
      return `<dt>${esc(name)}${single ? "" : `, ${monthName(end,"short")}`}</dt>
        <dd><span class="v">${fmtU(c.v, c.unit)}</span>${change(c.v, r?.v, c.unit)}</dd>
        ${single ? "" : `<dd>${spark(series)}</dd>`}`;
    }).join("");
    return `<div class="plat" style="--c:var(${p.cssVar})"><h3>${p.name}</h3>
      <div class="handle">${esc(handles[p.key] || "")}</div><dl>${rows}</dl></div>`;
  }).join("");

  const compareText = base
    ? `Changes compare ${monthName(end)} with ${monthName(base)}.`
    : `No earlier month to compare with.`;
  const detail = single ? DATA[state.client].months[end].detail : null;
  const take = detail ? `<section class="section"><h2>What happened this month</h2><div class="takeaways">${
    PLATFORMS.map(p => `<div class="panel" style="--c:var(${p.cssVar})"><h3>${p.name}</h3>
      <ul>${detail.takeaways[p.key].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div></section>` : "";

  const notes = (DATA[state.client].notes || []);
  const notesHtml = notes.length ? `<div class="panel notes"><h3>About this data</h3><ul>${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
  return `${notesHtml}<div class="strip">${strip}</div>
    <p class="note">${compareText}${single ? "" : " Lines show each month in the selected range."}</p>${take}`;
}

/* ---------- platform: one month ---------- */
function platformMonth(p, key){
  const cur = metricsFor(p, key), pk = prevKey(key), prev = pk ? metricsFor(p, pk) : null;
  const kpis = cur.map(m => {
    const r = prev ? pick(prev, m.n) : null;
    return `<div class="kpi"><div class="l">${esc(m.n)}</div><div class="v">${fmtU(m.v, m.unit)}</div>
      <div>${change(m.v, r?.v, m.unit, m.lib)}</div><div class="prev">${r && r.v != null ? monthName(pk,"short")+": "+fmtU(r.v, m.unit) : m.v == null ? "No data" : m.snap ? "Current total" : "No earlier data"}</div></div>`;
  }).join("");
  const d = DATA[state.client].months[key].detail?.[p.key];
  let more;
  if (!d){
    more = `<section class="section"><div class="panel empty">Daily trend and post list start from October 2026. Pick a range of months to compare this month with others.</div></section>`;
  } else {
    let side = "";
    if (d.audience){
      const max = Math.max(...d.audience.age.map(a => a[1])), g = d.audience.gender;
      side = `<div class="panel"><h3 style="font:700 16px var(--display);margin:0 0 12px">Audience</h3>
        <div class="bars" style="--accent:var(${p.cssVar})">${d.audience.age.map(([a,v]) =>
          `<div class="bar"><div>${a}</div><span><i style="width:${v/max*100}%"></i></span><b>${(v*100).toFixed(0)}%</b></div>`).join("")}</div>
        <div style="margin-top:18px;font-size:13px;color:var(--muted)">Gender</div>
        <div class="split"><i style="width:${g[0][1]*100}%;background:var(${p.cssVar})"></i><i style="width:${g[1][1]*100}%;background:var(--line)"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span>${g[0][0]} ${(g[0][1]*100).toFixed(0)}%</span><span>${g[1][0]} ${(g[1][1]*100).toFixed(0)}%</span></div></div>`;
    }
    const hasType = p.key === "instagram";
    const head = `<tr><th class="d">Posted</th><th class="cap">Content</th>${d.columns.map(c => `<th>${c}</th>`).join("")}</tr>`;
    const body = d.content.map(r => {
      const [date] = r, type = hasType ? r[1] : null, cap = hasType ? r[2] : r[1], url = hasType ? r[3] : r[2];
      const cells = r.slice(hasType ? 4 : 3).map((v, i) => {
        const col = d.columns[i];
        if (col === "Full watch") return `<td>${(v*100).toFixed(1)}%</td>`;
        if (col === "Avg watch") return `<td>${v.toFixed(1)}s</td>`;
        return `<td>${fmt(v === "" ? 0 : v)}</td>`;
      }).join("");
      const clipped = cap.length > 120 ? cap.slice(0, 117) + "…" : cap;
      return `<tr><td class="d">${dayLabel(date)}</td><td class="cap">${type ? `<span class="type">${type === "REELS" ? "Reel" : "Feed"}</span>` : ""}<a href="${esc(url)}" target="_blank" rel="noopener">${esc(clipped)}</a></td>${cells}</tr>`;
    }).join("");
    more = `<section class="section"><h2>Daily trend</h2>
        <div class="${side ? "grid2" : ""}"><div class="panel"><div class="chart-wrap"><canvas id="dailyChart" role="img" aria-label="Daily ${p.name} trend"></canvas></div></div>${side}</div></section>
      <section class="section"><h2>${esc(d.contentTitle)}</h2>
        <div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
        <p class="note">Sorted by views. Select a post to open it.</p></section>`;
  }
  return `<div class="kpis">${kpis}</div>
    <p class="note">Engagement rate = engagement ÷ reach. ${esc(p.note)}</p>${more}`;
}

/* ---------- platform: range of months ---------- */
function platformRange(p, ks){
  const per = ks.map(k => metricsFor(p, k));
  const names = per[0].map(m => m.n);
  if (!state.trendMetric[p.key]) state.trendMetric[p.key] = p.headline[0];
  const sel = state.trendMetric[p.key];

  const head = `<tr><th class="m">Metric</th>${ks.map(k => `<th>${monthName(k,"short")}</th>`).join("")}<th class="tot">Total</th><th>Change</th></tr>`;
  const rows = names.map((n, i) => {
    const vals = per.map(list => list[i]);
    const m = vals[0];
    const have = vals.filter(x => x.v != null);
    let total = "–";
    if (m.add && have.length) total = fmt(have.reduce((s, x) => s + x.v, 0));
    return `<tr><td class="m">${esc(n)}</td>${vals.map(x => `<td>${fmtU(x.v, x.unit)}</td>`).join("")}
      <td class="tot">${total}</td><td>${have.length > 1 ? change(have[have.length-1].v, have[0].v, m.unit, m.lib) : `<span class="chg flat">No comparison</span>`}</td></tr>`;
  }).join("");

  return `<section class="section" style="margin-top:0">
      <div class="section-head"><h2>Month by month</h2>
        <label>Metric <select id="trendSelect">${names.map(n => `<option ${n === sel ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label></div>
      <div class="panel"><div class="chart-wrap"><canvas id="trendChart" role="img" aria-label="${esc(sel)} by month"></canvas></div></div>
    </section>
    <section class="section">
      <div class="table-scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <p class="note">Engagement rate = engagement ÷ reach. Total adds up the months with data, and only for metrics that add up; reach, rates, averages and follower counts don’t. Change compares the first and last month with data. ${esc(p.note)}</p>
    </section>`;
}

/* ---------- charts ---------- */
function drawDaily(p, key){
  const d = DATA[state.client].months[key].detail?.[p.key];
  const canvas = document.getElementById("dailyChart");
  if (!d || !canvas || !window.Chart) return;
  const [y, mo] = key.split("-").map(Number);
  const labels = d.daily[0][1].map((_, i) => new Date(y, mo-1, i+1).toLocaleDateString("en-GB",{day:"numeric",month:"short"}));
  const main = css(p.cssVar), muted = css("--muted"), line = css("--line");
  charts.push(new Chart(canvas, {
    type:"line",
    data:{ labels, datasets: d.daily.map(([name, vals], i) => ({
      label:name, data:vals, yAxisID: i === 0 ? "y" : "y1",
      borderColor: i === 0 ? main : muted, backgroundColor: i === 0 ? main + "22" : "transparent",
      fill: i === 0, tension:.3, pointRadius:0, pointHoverRadius:4, borderWidth: i === 0 ? 2.5 : 1.5, borderDash: i === 0 ? [] : [5,4]
    })) },
    options:{ maintainAspectRatio:false, interaction:{mode:"index", intersect:false},
      plugins:{ legend:{labels:{color:muted, boxWidth:12, usePointStyle:true}}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${fmt(c.parsed.y)}`}} },
      scales:{ x:{ticks:{color:muted, maxTicksLimit:8}, grid:{display:false}},
        y:{position:"left", ticks:{color:muted, callback:short}, grid:{color:line}, title:{display:true, text:d.daily[0][0], color:muted}},
        y1:{position:"right", ticks:{color:muted, callback:short}, grid:{display:false}, title:{display:true, text:d.daily[1][0], color:muted}} } }
  }));
}

function drawTrend(p, ks){
  const canvas = document.getElementById("trendChart");
  if (!canvas || !window.Chart) return;
  const name = state.trendMetric[p.key];
  const vals = ks.map(k => pick(metricsFor(p, k), name));
  const unit = vals[0].unit;
  const data = vals.map(x => x.v == null ? null : unit === "%" ? +(x.v * 100).toFixed(2) : x.v);
  const main = css(p.cssVar), muted = css("--muted"), line = css("--line");
  const tick = v => unit === "%" ? v + "%" : unit === "s" ? v + "s" : short(v);
  charts.push(new Chart(canvas, {
    type:"bar",
    data:{ labels: ks.map(k => monthName(k,"short")), datasets:[{ label:name, data, backgroundColor: ks.map((_, i) => i === ks.length - 1 ? main : main + "88"), borderRadius:6, maxBarThickness:56 }] },
    options:{ maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c => `${name}: ${unit === "%" ? c.parsed.y.toFixed(2) + "%" : unit === "s" ? c.parsed.y.toFixed(1) + "s" : fmt(c.parsed.y)}`}} },
      scales:{ x:{ticks:{color:muted}, grid:{display:false}}, y:{beginAtZero:true, ticks:{color:muted, callback:tick}, grid:{color:line}} } }
  }));
}

/* ---------- main render ---------- */
function render(){
  charts.forEach(c => c.destroy()); charts = [];
  renderClients(); renderRange(); renderTabs();
  const client = DATA[state.client], ks = rangeKeys(), single = ks.length === 1;
  $("#title").textContent = client.name;
  $("#subtitle").textContent = single ? `Social media report, ${monthName(ks[0])}` : `Social media report, ${monthName(ks[0])} to ${monthName(ks[ks.length-1])}`;
  $("#sourceNote").textContent = `Data from Two Minutes Report, pulled ${client.pulled}.`;
  const p = PLATFORMS.find(x => x.key === state.tab);
  if (!p){ $("#view").innerHTML = overview(); return; }
  if (single){
    $("#view").innerHTML = platformMonth(p, ks[0]);
    drawDaily(p, ks[0]);
  } else {
    $("#view").innerHTML = platformRange(p, ks);
    $("#trendSelect").addEventListener("change", e => { state.trendMetric[p.key] = e.target.value; render(); });
    drawTrend(p, ks);
  }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
