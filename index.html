<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCA Social Media Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#13233F; --muted:#5B6B82; --line:#D5DEE7;
  --side:#03023A; --side-ink:#FFFFFF; --side-muted:#A6A8C8; --side-active:#1B1C4E; --side-line:rgba(255,255,255,.12);
  --tt:#0F9AA8; --ig:#B8336A; --fb:#3D5FB0;
  --up:#1F8A5B; --down:#C2452D;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--tt);outline-offset:2px}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:26px 14px 22px;display:flex;flex-direction:column;gap:30px;font-family:"Plus Jakarta Sans",var(--body);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:14px;padding:0 10px}
.brand-logo{width:70px;height:auto;flex:none;display:block}
.brand-div{width:1px;align-self:stretch;min-height:34px;background:var(--side-line)}
.brand-title{font:600 16px/1.25 "Plus Jakarta Sans",var(--body);color:var(--side-ink)}
.clients{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.clients button{all:unset;box-sizing:border-box;width:100%;padding:11px 14px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:500 15px "Plus Jakarta Sans",var(--body);color:var(--side-muted)}
.clients button:hover{background:var(--side-active);color:var(--side-ink)}
.clients button:focus-visible{outline:2px solid var(--side-muted);outline-offset:-2px}
.clients button[aria-current="true"]{background:var(--side-active);color:var(--side-ink);font-weight:600}
.clients button:disabled{cursor:default;color:var(--side-muted)}
.clients button:disabled:hover{background:none}
.clients .tag{font-size:12px;color:var(--side-muted)}
.side-foot{margin-top:auto;font-size:12px;line-height:1.5;color:var(--side-muted);padding:16px 10px 0;border-top:1px solid var(--side-line)}

main{padding:28px clamp(16px,4vw,44px) 56px;max-width:1240px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.top h1{font:700 clamp(28px,4vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--muted)}

.range{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.range label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.range select{font:500 15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.presets{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.presets button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;color:var(--muted)}
.presets button + button{border-left:1px solid var(--line)}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:500}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent,var(--ink))}

.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.plat{padding:22px 24px;border-top:5px solid var(--c)}
.plat + .plat{border-left:1px solid var(--line)}
.plat h3{font:700 20px var(--display);margin:0 0 2px}
.plat .handle{color:var(--muted);font-size:13px;margin-bottom:18px}
.plat dl{margin:0;display:grid;gap:14px}
.plat dt{font-size:13px;color:var(--muted)}
.plat dd{margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.plat .v{font:700 26px/1.1 var(--display)}
.spark{display:block;width:100%;height:30px;margin-top:4px;color:var(--c)}
.chg{font-size:13px;font-weight:600}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}

.section{margin-top:28px}
.section > h2{font:700 20px var(--display);margin:0 0 12px}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.section-head h2{font:700 20px var(--display);margin:0}
.section-head label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.section-head select{font:500 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.notes{margin-bottom:16px;border-left:4px solid var(--muted)}
.notes h3{font:700 16px var(--display);margin:0 0 6px}
.notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.notes li + li{margin-top:4px}
.takeaways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.takeaways .panel{border-left:4px solid var(--c)}
.takeaways h3{font:700 16px var(--display);margin:0 0 8px}
.takeaways ul{margin:0;padding-left:18px}
.takeaways li + li{margin-top:6px}
.takeaways h4{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.takeaways ul + h4{margin-top:14px}
.insight{background:color-mix(in srgb, var(--c, var(--ink)) 6%, var(--panel));border:1px solid color-mix(in srgb, var(--c, var(--ink)) 25%, var(--line));border-radius:12px;padding:12px 16px;margin:0 0 12px}
.insight h3{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.insight ul{margin:0;padding-left:18px}
.insight li + li{margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--panel);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:700 24px/1.2 var(--display);margin:4px 0 2px}
.kpi .prev{font-size:12px;color:var(--muted)}

.aud-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.aud-grid h3{font:700 18px var(--display);margin:0 0 14px;text-align:center}
.abars{display:flex;flex-direction:column;gap:12px}
.abar-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.abar-row b{font-weight:600}
.abar-track{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.abar-track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.gender{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.donut{width:min(240px,100%);height:auto}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:10px;min-width:150px}
.legend li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.legend b{font-weight:600}
.chart-wrap.short{height:220px}
.aud-grid.odd > .panel:last-child{grid-column:1 / -1}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vcards.ig .vthumb{aspect-ratio:4/5}
.vthumb{position:relative;display:block;aspect-ratio:3/4;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 30%,var(--panel)),color-mix(in srgb,var(--accent) 8%,var(--panel)));text-decoration:none}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--accent);opacity:.6}
.vviews{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:999px}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.vrow span{color:var(--muted)}
.vrow b{font-weight:500}
.vrow.dim b{color:var(--muted);font-weight:400}
.trend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.trend h3{font:700 17px var(--display);margin:0 0 4px}
.trend-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.trend-top .v{font:500 30px/1.1 var(--display)}
.chart-wrap.tiny{height:170px}
.peak{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.peak b{color:var(--ink)}
.peakpost{display:flex;align-items:center;gap:8px;max-width:60%;text-decoration:none;color:var(--muted)}
.peakpost img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}
.peakpost span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peakpost:hover span{text-decoration:underline}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-wrap{position:relative;height:280px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:80ch}
.empty{color:var(--muted)}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--panel)}
td.cap,th.cap{text-align:left;white-space:normal;min-width:260px;max-width:420px}
td.d,th.d{text-align:left}
th.m,td.m{text-align:left;font-weight:500;color:var(--ink);position:sticky;left:0;background:var(--panel)}
td.tot,th.tot{border-left:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.cap a{text-decoration:none}
td.cap a:hover{text-decoration:underline}
.type{display:inline-block;font-size:12px;color:var(--muted);margin-right:6px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:56px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar span{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block}
.bar span i{display:block;height:100%;background:var(--accent)}
.bar b{text-align:right;font-weight:600}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 8px}
.split i{display:block;height:100%}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{padding:16px;gap:14px;position:static;height:auto}
  .brand{padding:0 4px}
  .clients{flex-direction:row;overflow-x:auto}
  .clients button{white-space:nowrap}
  .side-foot{display:none}
  .strip,.takeaways,.grid2,.aud-grid,.trend-grid{grid-template-columns:1fr}
  .plat + .plat{border-left:none;border-top:5px solid var(--c)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const nf = new Intl.NumberFormat("en-US");
const fmt = n => n == null ? "–" : nf.format(Math.round(n * 100) / 100);
const short = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? (n/1e3).toFixed(1)+"K" : nf.format(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Per-section insights: detail[platform].insights = { daily, audience, followers, content }, each a list of sentences.
const insightBox = (d, section) => {
  const items = d?.insights?.[section];
  return items?.length ? `<div class="insight"><h3>Insight</h3><ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
};
// Takeaways are either a plain list, or { compare: [...], why: [...] } shown under two labels.
const takeawayLists = (t, base) => {
  const ul = items => `<ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (Array.isArray(t)) return ul(t);
  const prev = base ? `vs ${monthName(base).split(" ")[0]}` : "This month";
  return `<h4>${prev}</h4>${ul(t.compare || [])}${t.why?.length ? `<h4>Why</h4>${ul(t.why)}` : ""}`;
};
const monthName = (k, style="long") => { const [y,m] = k.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("en-GB", style === "long" ? {month:"long", year:"numeric"} : {month:"short"}); };
const dayLabel = iso => new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});

function fmtU(v, unit){
  if (v == null) return "–";
  if (unit === "s") return v.toFixed(1) + "s";
  if (unit === "%") return (v * 100 < 0.1 && v > 0 ? (v * 100).toFixed(3) : (v * 100).toFixed(2)) + "%";
  return fmt(v);
}
function change(cur, prev, unit, lowerIsBetter){
  if (prev == null || cur == null) return `<span class="chg flat">No comparison</span>`;
  if (unit === "%"){
    const pt = (cur - prev) * 100;
    if (Math.abs(pt) < 0.005) return `<span class="chg flat">0.00 pt</span>`;
    const cls = Math.abs(pt) < 0.05 ? "flat" : pt > 0 ? "up" : "down";
    return `<span class="chg ${cls}">${pt > 0 ? "+" : ""}${pt.toFixed(2)} pt</span>`;
  }
  if (prev === 0) return `<span class="chg flat">New</span>`;
  const p = (cur - prev) / prev * 100;
  const good = lowerIsBetter ? p < 0 : p > 0;
  const cls = Math.abs(p) < 0.5 ? "flat" : good ? "up" : "down";
  return `<span class="chg ${cls}">${p > 0 ? "+" : ""}${p.toFixed(1)}%</span>`;
}

/* All metrics for one platform in one month, as {name: {v, unit, add}}, incl. engagement rate */
function metricsFor(p, monthKey){
  const row = DATA[state.client].months[monthKey]?.[p.key];
  const out = [];
  p.metrics.forEach((m, i) => {
    out.push({n:m.n, unit:m.unit, add:!!m.add, lib:!!m.lowerIsBetter, snap:!!m.snapshot, v: row ? row[i] : null});
    if (p.er && m.n === p.er[0]){
      const num = row ? row[p.metrics.findIndex(x => x.n === p.er[0])] : null;
      const den = row ? row[p.metrics.findIndex(x => x.n === p.er[1])] : null;
      out.push({n:"Engagement rate", unit:"%", add:false, v: (num != null && den) ? num / den : null});
    }
  });
  return out;
}
const pick = (list, name) => list.find(x => x.n === name);

/* ---------- state ---------- */
const state = { client:"perspirex", from:null, to:null, tab:"overview", trendMetric:{} };
let charts = [];
const monthKeys = () => Object.keys(DATA[state.client].months).sort();
const rangeKeys = () => monthKeys().filter(k => k >= state.from && k <= state.to);
const prevKey = k => { const ks = monthKeys(); const i = ks.indexOf(k); return i > 0 ? ks[i-1] : null; };

/* ---------- controls ---------- */
function renderClients(){
  $("#clientList").innerHTML = Object.entries(DATA).map(([key, c]) => {
    const has = Object.keys(c.months).length > 0;
    return `<li><button type="button" data-client="${key}" ${has ? "" : "disabled"} aria-current="${key === state.client}">
      ${esc(c.name)}${has ? "" : `<span class="tag">No report yet</span>`}</button></li>`;
  }).join("");
  $("#clientList").querySelectorAll("button:not(:disabled)").forEach(b =>
    b.addEventListener("click", () => { state.client = b.dataset.client; state.from = state.to = null; state.tab = "overview"; render(); }));
}

const PRESETS = [["Latest month",1],["Last 3 months",3],["Last 6 months",6]];
function renderRange(){
  const ks = monthKeys();
  if (!state.to || !ks.includes(state.to)) state.to = ks[ks.length - 1];
  if (!state.from || !ks.includes(state.from)) state.from = state.to;
  const opts = sel => ks.map(k => `<option value="${k}" ${k === sel ? "selected" : ""}>${monthName(k)}</option>`).join("");
  $("#fromSelect").innerHTML = opts(state.from);
  $("#toSelect").innerHTML = opts(state.to);
  const span = rangeKeys().length, last = state.to === ks[ks.length - 1];
  $("#presets").innerHTML = PRESETS.map(([label, n]) =>
    `<button type="button" data-n="${n}" aria-pressed="${last && span === Math.min(n, ks.length)}">${label}</button>`).join("");
  $("#presets").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const n = Number(b.dataset.n);
    state.to = ks[ks.length - 1];
    state.from = ks[Math.max(0, ks.length - n)];
    render();
  }));
}
$("#fromSelect").addEventListener("change", e => { state.from = e.target.value; if (state.from > state.to) state.to = state.from; render(); });
$("#toSelect").addEventListener("change", e => { state.to = e.target.value; if (state.to < state.from) state.from = state.to; render(); });

function renderTabs(){
  const tabs = [{key:"overview", name:"Overview", cssVar:"--ink"}, ...PLATFORMS];
  $("#tabs").innerHTML = tabs.map(t =>
    `<button type="button" role="tab" data-tab="${t.key}" aria-selected="${t.key === state.tab}" style="--accent:var(${t.cssVar})">${t.name}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
}

/* ---------- small SVG sparkline ---------- */
function spark(values){
  const pts = values.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const vs = pts.map(p => p[1]), min = Math.min(...vs), max = Math.max(...vs), n = values.length - 1;
  const xy = pts.map(([i, v]) => `${(i / n * 100).toFixed(2)},${(26 - (max === min ? 13 : (v - min) / (max - min) * 22) - 2).toFixed(2)}`);
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${xy.join(" ")}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- overview ---------- */
function overview(){
  const ks = rangeKeys(), single = ks.length === 1, end = ks[ks.length - 1];
  const base = single ? prevKey(end) : ks[0];
  const handles = DATA[state.client].handles || {};

  const strip = PLATFORMS.map(p => {
    const cur = metricsFor(p, end), ref = base ? metricsFor(p, base) : null;
    const rows = p.headline.map(name => {
      const c = pick(cur, name), r = ref ? pick(ref, name) : null;
      const series = ks.map(k => pick(metricsFor(p, k), name).v);
      return `<dt>${esc(name)}${single ? "" : `, ${monthName(end,"short")}`}</dt>
        <dd><span class="v">${fmtU(c.v, c.unit)}</span>${change(c.v, r?.v, c.unit)}</dd>
        ${single ? "" : `<dd>${spark(series)}</dd>`}`;
    }).join("");
    return `<div class="plat" style="--c:var(${p.cssVar})"><h3>${p.name}</h3>
      <div class="handle">${esc(handles[p.key] || "")}</div><dl>${rows}</dl></div>`;
  }).join("");

  const compareText = base
    ? `Changes compare ${monthName(end)} with ${monthName(base)}.`
    : `No earlier month to compare with.`;
  const detail = single ? DATA[state.client].months[end].detail : null;
  const take = detail ? `<section class="section"><h2>What happened this month</h2><div class="takeaways">${
    PLATFORMS.map(p => `<div class="panel" style="--c:var(${p.cssVar})"><h3>${p.name}</h3>
      ${takeawayLists(detail.takeaways[p.key], base)}</div>`).join("")}</div></section>` : "";

  const notes = (DATA[state.client].notes || []);
  const notesHtml = notes.length ? `<div class="panel notes"><h3>About this data</h3><ul>${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : "";
  return `${notesHtml}<div class="strip">${strip}</div>
    <p class="note">${compareText}${single ? "" : " Lines show each month in the selected range."}</p>${take}`;
}


/* ---------- TikTok audience: age, locations, gender, most active times ---------- */
const pct1 = v => (v * 100).toFixed(1) + "%";
function shareBars(rows, relative){
  const max = relative ? Math.max(...rows.map(r => r[1])) : 1;
  return `<div class="abars">${rows.map(([label, v]) =>
    `<div class="abar"><div class="abar-row"><span>${esc(label)}</span><b>${pct1(v)}</b></div>
      <span class="abar-track"><i style="width:${Math.min(100, v / max * 100)}%"></i></span></div>`).join("")}</div>`;
}
function halfDonut(parts){
  const L = Math.PI * 50; let off = 0;
  const shades = ["var(--accent)", "color-mix(in srgb, var(--accent) 55%, var(--panel))", "color-mix(in srgb, var(--accent) 25%, var(--panel))"];
  const arcs = parts.map(([, v], i) => {
    const len = v * L, seg = `<path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="${shades[i] || shades[2]}" stroke-width="18"
      stroke-dasharray="${len} ${L}" stroke-dashoffset="${-off}"/>`;
    off += len; return seg;
  }).join("");
  return `<svg viewBox="0 0 120 66" class="donut" role="img" aria-label="Gender split">
    <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--line)" stroke-width="18"/>${arcs}</svg>`;
}
function audienceSection(aud, p, ins = ""){
  const g = aud.gender.slice();
  if (!g.some(x => x[0] === "Other")) g.push(["Other", Math.max(0, 1 - g.reduce((s, x) => s + x[1], 0))]);
  const cities = aud.cities ? [...aud.cities, ["Other", Math.max(0, 1 - aud.cities.reduce((s, x) => s + x[1], 0))]] : null;
  const shades = ["var(--accent)", "color-mix(in srgb, var(--accent) 55%, var(--panel))", "color-mix(in srgb, var(--accent) 25%, var(--panel))"];
  const panels = [
    `<div class="panel"><h3>Age</h3>${shareBars(aud.age)}</div>`,
    cities ? `<div class="panel"><h3>Locations</h3>${shareBars(cities)}</div>` : "",
    `<div class="panel"><h3>Gender</h3><div class="gender">${halfDonut(g)}
      <ul class="legend">${g.map(([n, v], i) => `<li><i style="background:${shades[i]}"></i>${esc(n)}<b>${(v * 100).toFixed(0)}%</b></li>`).join("")}</ul></div></div>`,
    aud.activeHours ? `<div class="panel"><h3>Most active times</h3><div class="chart-wrap short"><canvas id="activeChart" role="img" aria-label="Followers active by hour"></canvas></div></div>` : ""
  ].filter(Boolean);
  const missing = `<p class="note">Current followers, as TikTok reports them today (not limited to the selected month).</p>` + (aud.activeHours ? "" : `<p class="note">Most active times isn’t available from Two Minutes Report. Add the 24 hourly values from TikTok’s own analytics to show it here.</p>`);
  return `<section class="section"><h2>Followers</h2>${ins}
    <div class="aud-grid${panels.length % 2 ? " odd" : ""}" style="--accent:var(${p.cssVar})">${panels.join("")}</div>${missing}</section>`;
}
function drawActive(p, key){
  const aud = DATA[state.client].months[key].detail?.[p.key]?.audience;
  const canvas = document.getElementById("activeChart");
  if (!aud?.activeHours || !canvas || !window.Chart) return;
  const hrs = aud.activeHours, peak = hrs.indexOf(Math.max(...hrs));
  const labels = hrs.map((_, h) => (h % 12 || 12) + (h < 12 ? "a" : "p"));
  const main = css(p.cssVar), muted = css("--muted"), line = css("--line");
  charts.push(new Chart(canvas, { type:"bar",
    data:{ labels, datasets:[{ data:hrs, backgroundColor: hrs.map((_, i) => i === peak ? main : main + "44"), borderRadius:3 }] },
    options:{ maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c => fmt(c.parsed.y) + " followers"}} },
      scales:{ x:{ticks:{color:muted, maxTicksLimit:12}, grid:{display:false}}, y:{beginAtZero:true, ticks:{color:muted, callback:short}, grid:{color:line}} } } }));
}


/* ---------- TikTok video cards ---------- */
const videoId = url => (String(url).match(/video\/(\d+)/) || [])[1] || "";

/* ---------- Instagram: four trend panels + follower demographics ---------- */
let pending = [];
const dayName = (key, i) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, i + 1).toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"}); };
function igTrends(d, p, key){
  const t = d.trends, cur = metricsFor(p, key), pk = prevKey(key), prev = pk ? metricsFor(p, pk) : null;
  const panels = [
    {id:"reach", title:"Reach", series:t.reach, metric:"Reach"},
    {id:"follows", title:"Follows", series:t.follows, metric:"New followers",
      note: t.followsFrom ? `Daily follows available from ${t.followsFrom} Oct; Instagram keeps 30 days of daily follower history. The total covers the whole month.` : null},
    {id:"interactions", title:"Content interactions", series:t.interactions, metric:"Engagement",
      note:"Interactions on the posts published each day."},
    {id:"visits", title:"Visits", series:t.visits, metric:"Profile views"}
  ];
  const html = panels.map(pn => {
    const c = pick(cur, pn.metric), r = prev ? pick(prev, pn.metric) : null;
    let peak = "";
    if (pn.series){
      const vals = pn.series.map(v => v == null ? -1 : v), i = vals.indexOf(Math.max(...vals));
      const peakDate = `${key}-${String(i + 1).padStart(2, "0")}`;
      const post = d.content.find(r => r[0] === peakDate) || d.content.filter(r => r[0] < peakDate).sort((a, b) => a[0] < b[0] ? 1 : -1)[0];
      const code = post ? (post[3].match(/\/(?:p|reel)\/([^/]+)/) || [])[1] : "";
      peak = `<div class="peak"><span>Peak ${dayName(key, i)}: <b>${fmt(pn.series[i])}</b></span>${post ? `
        <a class="peakpost" href="${esc(post[3])}" target="_blank" rel="noopener" title="${esc(post[2])}">
          <img src="thumbs/ig_${code}.jpg" alt="" onerror="this.remove()"><span>${esc(post[2].slice(0, 60))}${post[2].length > 60 ? "…" : ""}</span></a>` : ""}</div>`;
      pending.push(() => drawSpark(`ig_${pn.id}`, pn.series, p, key, pn.title));
    }
    return `<div class="panel trend"><h3>${pn.title}</h3>
      <div class="trend-top"><span class="v">${fmtU(c?.v)}</span>${change(c?.v, r?.v)}</div>
      ${pn.series ? `<div class="chart-wrap tiny"><canvas id="ig_${pn.id}" role="img" aria-label="${pn.title} by day"></canvas></div>${peak}` : `<p class="empty">No daily data from Instagram for this account.</p>`}
      ${pn.note && pn.series ? `<p class="note">${pn.note}</p>` : ""}</div>`;
  }).join("");
  return `<section class="section"><h2>Daily trends</h2>${insightBox(d, "daily")}<div class="trend-grid" style="--accent:var(${p.cssVar})">${html}</div></section>`;
}
function drawSpark(id, series, p, key, label){
  const canvas = document.getElementById(id);
  if (!canvas || !window.Chart) return;
  const main = css(p.cssVar), muted = css("--muted"), line = css("--line");
  charts.push(new Chart(canvas, { type:"line",
    data:{ labels: series.map((_, i) => dayName(key, i)), datasets:[{ label, data:series, borderColor:main, backgroundColor:main + "22", fill:true, tension:.3, pointRadius:0, pointHoverRadius:4, borderWidth:2, spanGaps:false }] },
    options:{ maintainAspectRatio:false, interaction:{mode:"index", intersect:false},
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c => `${label}: ${fmt(c.parsed.y)}`}} },
      scales:{ x:{ticks:{color:muted, maxTicksLimit:6, callback:(v, i) => (i + 1) % 5 === 1 ? (i + 1) + " " + monthName(key, "short") : ""}, grid:{display:false}},
        y:{beginAtZero:true, ticks:{color:muted, callback:short, maxTicksLimit:4}, grid:{color:line}} } } }));
}
function igFollowers(d, p, key){
  const f = d.followers;
  if (!f) return `<section class="section"><h2>Followers</h2>${insightBox(d, "followers")}<div class="panel empty">Instagram doesn’t share follower age, gender or city for this account yet; Meta withholds them for small accounts.</div></section>`;
  const totalFollowers = pick(metricsFor(p, key), "Followers")?.v;
  const known = f.ageGender.reduce((s, [, fm, m]) => s + fm + m, 0);
  const cities = totalFollowers ? f.cities.map(([c, n]) => [c, n / totalFollowers]) : [];
  pending.push(() => drawAgeGender(f.ageGender, known));
  return `<section class="section"><h2>Followers</h2>${insightBox(d, "followers")}<div class="aud-grid" style="--accent:var(${p.cssVar})">
    <div class="panel"><h3>Age &amp; gender</h3><div class="chart-wrap" style="height:380px"><canvas id="igAgeGender" role="img" aria-label="Followers by age and gender"></canvas></div>
      <p class="note">Share of followers aged 18–64 whose gender is known, matching Meta’s chart.</p></div>
    <div class="panel"><h3>Top 10 cities</h3>${shareBars(cities, true)}<p class="note">Share of all ${fmt(totalFollowers)} followers.</p></div>
  </div></section>`;
}
const valueLabels = { id:"valueLabels", afterDatasetsDraw(chart){
  const {ctx} = chart; ctx.save(); ctx.font = "600 11px " + css("--body"); ctx.textAlign = "center";
  chart.data.datasets.forEach((ds, i) => chart.getDatasetMeta(i).data.forEach((bar, j) => {
    ctx.fillStyle = ds.backgroundColor; ctx.fillText(ds.data[j].toFixed(1) + "%", bar.x, bar.y - 5); }));
  ctx.restore(); } };
function drawAgeGender(rows, known){
  const canvas = document.getElementById("igAgeGender");
  if (!canvas || !window.Chart) return;
  const muted = css("--muted"), line = css("--line"), female = css("--ig"), male = css("--fb");
  charts.push(new Chart(canvas, { type:"bar", plugins:[valueLabels],
    data:{ labels: rows.map(r => r[0]), datasets:[
      { label:"Female", data: rows.map(r => r[1] / known * 100), backgroundColor:female, borderRadius:4 },
      { label:"Male", data: rows.map(r => r[2] / known * 100), backgroundColor:male, borderRadius:4 }] },
    options:{ maintainAspectRatio:false, layout:{padding:{top:16}},
      plugins:{ legend:{labels:{color:muted, boxWidth:12, usePointStyle:true}}, tooltip:{callbacks:{label:c => `${c.dataset.label}: ${c.parsed.y.toFixed(2)}%`}} },
      scales:{ x:{ticks:{color:muted}, grid:{display:false}}, y:{beginAtZero:true, ticks:{color:muted, callback:v => v + "%"}, grid:{color:line}} } } }));
}


/* ---------- Facebook: follower cities ---------- */

/* ---------- platform: one month ---------- */
function platformMonth(p, key){
  const cur = metricsFor(p, key), pk = prevKey(key), prev = pk ? metricsFor(p, pk) : null;
  const kpis = cur.map(m => {
    const r = prev ? pick(prev, m.n) : null;
    return `<div class="kpi"><div class="l">${esc(m.n)}</div><div class="v">${fmtU(m.v, m.unit)}</div>
      <div>${change(m.v, r?.v, m.unit, m.lib)}</div><div class="prev">${r && r.v != null ? monthName(pk,"short")+": "+fmtU(r.v, m.unit) : m.v == null ? "No data" : m.snap ? "Current total" : "No earlier data"}</div></div>`;
  }).join("");
  const d = DATA[state.client].months[key].detail?.[p.key];
  let more;
  if (!d){
    more = `<section class="section"><div class="panel empty">Daily trend and post list start from October 2026. Pick a range of months to compare this month with others.</div></section>`;
  } else {
    const audience = d.audience ? audienceSection(d.audience, p, insightBox(d, "audience")) : "";
    const hasType = p.key === "instagram";
    const head = `<tr><th class="d">Posted</th><th class="cap">Content</th>${d.columns.map(c => `<th>${c}</th>`).join("")}</tr>`;
    const body = d.content.map(r => {
      const [date] = r, type = hasType ? r[1] : null, cap = hasType ? r[2] : r[1], url = hasType ? r[3] : r[2];
      const cells = r.slice(hasType ? 4 : 3).map((v, i) => {
        const col = d.columns[i];
        if (col === "Full watch") return `<td>${(v*100).toFixed(1)}%</td>`;
        if (col === "Avg watch") return `<td>${v.toFixed(1)}s</td>`;
        return `<td>${fmt(v === "" ? 0 : v)}</td>`;
      }).join("");
      const clipped = cap.length > 120 ? cap.slice(0, 117) + "…" : cap;
      return `<tr><td class="d">${dayLabel(date)}</td><td class="cap">${type ? `<span class="type">${type === "REELS" ? "Reel" : "Feed"}</span>` : ""}<a href="${esc(url)}" target="_blank" rel="noopener">${esc(clipped)}</a></td>${cells}</tr>`;
    }).join("");
    more = p.key === "instagram" && d.trends ? igTrends(d, p, key) + igFollowers(d, p, key) + `<section class="section"><h2>${esc(d.contentTitle)}</h2>${insightBox(d, "content")}${igCards(d, p)}</section>` : `<section class="section"><h2>Daily trend</h2>${insightBox(d, "daily")}
        <div class="panel"><div class="chart-wrap"><canvas id="dailyChart" role="img" aria-label="Daily ${p.name} trend"></canvas></div>${d.dailyNote ? `<p class="note">${esc(d.dailyNote)}</p>` : ""}</div></section>${audience}${p.key === "facebook" ? fbFollowers(d, p, key) : ""}
      <section class="section"><h2>${esc(d.contentTitle)}</h2>${insightBox(d, "content")}
        ${p.key === "tiktok" ? videoCards(d, p) : `<div class="table-scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
        <p class="note">Sorted by views. Select a post to open it.</p>`}</section>`;
  }
  return `<div style="--c:var(${p.cssVar})"><div class="kpis">${kpis}</div>
    <p class="note">Engagement rate = engagement ÷ reach. ${esc(p.note)}</p>${more}</div>`;
}

/* ---------- platform: range of months ---------- */
function platformRange(p, ks){
  const per = ks.map(k => metricsFor(p, k));
  const names = per[0].map(m => m.n);
  if (!state.trendMetric[p.key]) state.trendMetric[p.key] = p.headline[0];
  const sel = state.trendMetric[p.key];

  const head = `<tr><th class="m">Metric</th>${ks.map(k => `<th>${monthName(k,"short")}</th>`).join("")}<th class="tot">Total</th><th>Change</th></tr>`;
  const rows = names.map((n, i) => {
    const vals = per.map(list => list[i]);
    const m = vals[0];
    const have = vals.filter(x => x.v != null);
    let total = "–";
    if (m.add && have.length) total = fmt(have.reduce((s, x) => s + x.v, 0));
    return `<tr><td class="m">${esc(n)}</td>${vals.map(x => `<td>${fmtU(x.v, x.unit)}</td>`).join("")}
      <td class="tot">${total}</td><td>${have.length > 1 ? change(have[have.length-1].v, have[0].v, m.unit, m.lib) : `<span class="chg flat">No comparison</span>`}</td></tr>`;
  }).join("");

  return `<section class="section" style="margin-top:0">
      <div class="section-head"><h2>Month by month</h2>
        <label>Metric <select id="trendSelect">${names.map(n => `<option ${n === sel ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label></div>
      <div class="panel"><div class="chart-wrap"><canvas id="trendChart" role="img" aria-label="${esc(sel)} by month"></canvas></div></div>
    </section>
    <section class="section">
      <div class="table-scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <p class="note">Engagement rate = engagement ÷ reach. Total adds up the months with data, and only for metrics that add up; reach, rates, averages and follower counts don’t. Change compares the first and last month with data. ${esc(p.note)}</p>
    </section>`;
}

function drawTrend(p, ks){
  const canvas = document.getElementById("trendChart");
  if (!canvas || !window.Chart) return;
  const name = state.trendMetric[p.key];
  const vals = ks.map(k => pick(metricsFor(p, k), name));
  const unit = vals[0].unit;
  const data = vals.map(x => x.v == null ? null : unit === "%" ? +(x.v * 100).toFixed(2) : x.v);
  const main = css(p.cssVar), muted = css("--muted"), line = css("--line");
  const tick = v => unit === "%" ? v + "%" : unit === "s" ? v + "s" : short(v);
  charts.push(new Chart(canvas, {
    type:"bar",
    data:{ labels: ks.map(k => monthName(k,"short")), datasets:[{ label:name, data, backgroundColor: ks.map((_, i) => i === ks.length - 1 ? main : main + "88"), borderRadius:6, maxBarThickness:56 }] },
    options:{ maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c => `${name}: ${unit === "%" ? c.parsed.y.toFixed(2) + "%" : unit === "s" ? c.parsed.y.toFixed(1) + "s" : fmt(c.parsed.y)}`}} },
      scales:{ x:{ticks:{color:muted}, grid:{display:false}}, y:{beginAtZero:true, ticks:{color:muted, callback:tick}, grid:{color:line}} } }
  }));
}

/* ---------- main render ---------- */
function render(){
  charts.forEach(c => c.destroy()); charts = []; pending = [];
  renderClients(); renderRange(); renderTabs();
  const client = DATA[state.client], ks = rangeKeys(), single = ks.length === 1;
  $("#title").textContent = client.name;
  $("#subtitle").textContent = single ? `Social media report, ${monthName(ks[0])}` : `Social media report, ${monthName(ks[0])} to ${monthName(ks[ks.length-1])}`;
  $("#sourceNote").textContent = `Data from Two Minutes Report, pulled ${client.pulled}.`;
  const p = PLATFORMS.find(x => x.key === state.tab);
  if (!p){ $("#view").innerHTML = overview(); return; }
  if (single){
    $("#view").innerHTML = platformMonth(p, ks[0]);
    drawDaily(p, ks[0]);
    pending.forEach(fn => fn()); pending = [];
    drawActive(p, ks[0]);
  } else {
    $("#view").innerHTML = platformRange(p, ks);
    $("#trendSelect").addEventListener("change", e => { state.trendMetric[p.key] = e.target.value; render(); });
    drawTrend(p, ks);
  }
}
render();
</script>
</body>
</html>
